# Builds the website from two branches and publishes it to the gh-pages branch:
#   public -> https://<user>.github.io/wood-cut-planner/
#   dev    -> https://<user>.github.io/wood-cut-planner/dev/
# One-time setup: Settings -> Pages -> Deploy from a branch -> gh-pages / (root)
name: Build site (public + dev)

on:
  push:
    branches: [public, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public
        uses: actions/checkout@v4
        with:
          ref: public
          path: public

      - name: Check out dev
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: dev

      - name: Assemble site
        run: |
          mkdir -p site
          cp public/index.html site/index.html
          if [ -d public/docs ]; then cp -r public/docs site/docs; fi
          if [ -f dev/index.html ]; then
            mkdir -p site/dev
            cp dev/index.html site/dev/index.html
          fi
          touch site/.nojekyll

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB=$(git -C public rev-parse --short HEAD)
          DEV=$(git -C dev rev-parse --short HEAD 2>/dev/null || echo none)
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build site from public@$PUB and dev@$DEV"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
